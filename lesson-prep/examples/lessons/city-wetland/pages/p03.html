<h2>城市里的湿地在哪</h2>
<table>
  <thead>
    <tr><th>类型</th><th>在城市里的样子</th><th>水从哪里来</th></tr>
  </thead>
  <tbody>
    <tr><td>河漫滩</td><td>河道两侧涨水会淹、退水会露的那条带</td><td>河水涨落</td></tr>
    <tr><td>湖滨浅水带</td><td>湖边水深不到膝盖、长着成片芦苇的一圈</td><td>湖水</td></tr>
    <tr><td>雨水塘</td><td>小区和公园里那口平时只有半满的塘</td><td>周边地面汇来的雨水</td></tr>
  </tbody>
</table>
<p>三种都占住了积水、湿土、耐水植物这三层，所以都算数。它们不在郊外，就在我们每天路过的地方。</p>

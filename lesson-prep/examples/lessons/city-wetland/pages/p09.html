<h2>为什么容易被填掉</h2>
<table>
  <thead>
    <tr><th>比一比</th><th>留成湿地</th><th>填平盖楼</th></tr>
  </thead>
  <tbody>
    <tr><td>好处落在谁身上</td><td>蓄水、净化、栖息地、降温，<strong>分散在整座城市</strong></td><td>这一块地的账本上</td></tr>
    <tr><td>什么时候拿到</td><td>要等一场暴雨、一个夏天才看得见</td><td>立刻</td></tr>
    <tr><td>能不能折算成租金</td><td>很难</td><td>很容易</td></tr>
  </tbody>
</table>
<p>所以要留住它，得先把这些用处说清楚，再<strong>把它写进城市的规划</strong>里，让它在图纸上就有名分——而不是等暴雨淹了街区才想起来。</p>

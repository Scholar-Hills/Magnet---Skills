<h2>湿地是什么</h2>
<p>课文给的说法有三层，缺一层就不算：</p>
<ol>
  <li><strong>常年或者季节性积水</strong>——水不是偶尔来一次，是长期都在。</li>
  <li><strong>土壤长期被水浸润</strong>——泥是湿的，不是雨后晒一天就干。</li>
  <li><strong>长着耐水的植物</strong>——芦苇、香蒲这类站在水里也活得好的。</li>
</ol>
<p>合起来，它是水和陆地之间的<strong>水陆过渡地带</strong>：不完全是水，也不完全是陆。</p>
<blockquote>路面上雨后的一个凹坑，天一晴就干透，三层一层都不占，所以它不是湿地。</blockquote>
